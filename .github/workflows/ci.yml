name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Bei mehreren Pushes hintereinander nur den jeweils neuesten Lauf behalten
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Tests & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Datenbank anlegen (Prisma)
        run: npm run setup

      - name: Production-Build
        run: npm run build

      - name: Unit-Tests
        run: npm run test

      - name: Chromium für Playwright installieren
        run: npx playwright install --with-deps chromium

      - name: End-to-End-Test (Demo-Durchlauf)
        run: npm run e2e

      - name: Playwright-Bericht bei Fehlschlag sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
